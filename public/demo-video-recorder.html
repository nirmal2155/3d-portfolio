<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TrafficMitra AI — Automated Working Video Generator</title>
  <style>
    body {
      margin: 0;
      background: #060b13;
      color: #e2e8f0;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-h: 100vh;
    }
    .container {
      width: 90%;
      max-width: 1000px;
      background: #0f172a;
      border: 1px solid #00f2fe;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 50px rgba(0, 242, 254, 0.3);
      text-align: center;
    }
    iframe {
      width: 100%;
      height: 520px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      margin-top: 16px;
    }
    button {
      background: linear-gradient(135deg, #00f2fe, #10b981);
      color: #060b13;
      border: none;
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin: 8px;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }
    button:hover {
      opacity: 0.9;
    }
    .status {
      margin-top: 12px;
      color: #10b981;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎬 TRAFFICMITRA AI — AUTOMATED VIDEO DEMO RECORDER</h2>
    <p>Click below to play the automated 2.5-minute presentation tour & download your working video file!</p>
    
    <div>
      <button id="startBtn">▶️ START AUTOMATED DEMO TOUR & RECORD VIDEO</button>
      <button id="downloadBtn" style="display:none;">📥 DOWNLOAD RECORDED VIDEO (.WEBM / .MP4)</button>
    </div>

    <div class="status" id="statusText">STATUS: READY TO RECORD</div>

    <iframe id="previewFrame" src="/"></iframe>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusText = document.getElementById('statusText');
    const iframe = document.getElementById('previewFrame');

    let mediaRecorder;
    let recordedChunks = [];

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      statusText.innerText = "STATUS: RECORDING AUTOMATED DEMO TOUR (2.5 MINS)...";

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });

        recordedChunks = [];
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const url = URL.createObjectURL(blob);
          downloadBtn.href = url;
          downloadBtn.onclick = () => {
            const a = document.createElement('a');
            a.href = url;
            a.download = 'TrafficMitra_AI_Official_Demo_Video.webm';
            a.click();
          };
          downloadBtn.style.display = 'inline-block';
          statusText.innerText = "STATUS: RECORDING COMPLETE! CLICK BELOW TO DOWNLOAD.";
        };

        mediaRecorder.start();

        // Automated Tour Sequence
        setTimeout(() => { iframe.src = "/?tab=cv"; }, 5000);
        setTimeout(() => { iframe.src = "/?tab=adaptive"; }, 25000);
        setTimeout(() => { iframe.src = "/?tab=quantum"; }, 55000);
        setTimeout(() => { iframe.src = "/?tab=sar"; }, 85000);
        setTimeout(() => { iframe.src = "/?tab=acousticsiren"; }, 115000);
        setTimeout(() => { iframe.src = "/?tab=cv2x"; }, 135000);

        setTimeout(() => {
          mediaRecorder.stop();
          stream.getTracks().forEach(track => track.stop());
        }, 150000);

      } catch (err) {
        statusText.innerText = "ERROR / CANCELLED: Please allow screen capture permission to record.";
        startBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
